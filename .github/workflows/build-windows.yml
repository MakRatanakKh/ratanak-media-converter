name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Prepare FFmpeg binaries
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }

          function Resolve-RealBinary([string] $Name) {
            $command = Get-Command $Name -ErrorAction SilentlyContinue
            if ($command) {
              $candidate = Get-Item $command.Source
              if ($candidate.Length -gt 1MB) {
                return $candidate
              }
            }

            $searchRoot = Join-Path $env:ChocolateyInstall "lib"
            $candidate = Get-ChildItem $searchRoot -Recurse -File -Filter "$Name.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -gt 1MB } |
              Sort-Object Length -Descending |
              Select-Object -First 1

            if (-not $candidate) {
              throw "Could not locate the real $Name executable. Refusing to package a shim."
            }

            return $candidate
          }

          $ffmpeg = Resolve-RealBinary "ffmpeg"
          $ffprobe = Resolve-RealBinary "ffprobe"

          New-Item -ItemType Directory -Force -Path vendor\ffmpeg\bin | Out-Null
          Copy-Item $ffmpeg.FullName vendor\ffmpeg\bin\ffmpeg.exe
          Copy-Item $ffprobe.FullName vendor\ffmpeg\bin\ffprobe.exe

          if ((Get-Item vendor\ffmpeg\bin\ffmpeg.exe).Length -lt 1MB) {
            throw "ffmpeg.exe is unexpectedly small and may be a shim."
          }
          if ((Get-Item vendor\ffmpeg\bin\ffprobe.exe).Length -lt 1MB) {
            throw "ffprobe.exe is unexpectedly small and may be a shim."
          }

          .\vendor\ffmpeg\bin\ffmpeg.exe -version
          .\vendor\ffmpeg\bin\ffprobe.exe -version

      - name: Build Windows application
        shell: pwsh
        run: .\build_windows.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RatanakMediaConverter-Windows
          path: dist\RatanakMediaConverter\
          if-no-files-found: error
