name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Prepare FFmpeg binaries
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }

          New-Item -ItemType Directory -Force -Path vendor\ffmpeg\bin | Out-Null
          Copy-Item (Get-Command ffmpeg).Source vendor\ffmpeg\bin\ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source vendor\ffmpeg\bin\ffprobe.exe

      - name: Build Windows application
        shell: pwsh
        run: .\build_windows.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RatanakMediaConverter-Windows
          path: dist\RatanakMediaConverter\
          if-no-files-found: error
